name: Deploy to an environment

# The same steps for dev and for prod: only the environment changes, and with it the project,
# the deployer that may act there and, for prod, Mario's approval before the job starts. Both
# deploy what one run of Deploy built: its commit, its image and its web.
on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      commit:
        description: The commit that run of Deploy built
        required: true
        type: string
      run-id:
        description: The run of Deploy that built the image and the web
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One deploy or load of the catalog at a time per environment: together they would take more
    # connections of the database than its budget leaves (see the room server below).
    concurrency:
      group: database-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    env:
      PROJECT: thelever-app-${{ inputs.environment }}
      WEB_DOMAIN: ${{ inputs.environment == 'prod' && 'thelever.app' || 'dev.thelever.app' }}
      WORKLOAD_IDENTITY_PROVIDER: projects/236232367578/locations/global/workloadIdentityPools/github/providers/thelever-app-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Sign in to Google Cloud as the deployer of the environment
        env:
          SERVICE_ACCOUNT: deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
        run: .github/scripts/gcp-auth.sh

      # From the same image as the room server, before its new revision serves anyone: each
      # migration must also work with the revision still serving. A failure stops the deploy.
      # The dilemmas come from the curated catalog, which the job catalog-import loads.
      - name: Migrate the database
        run: |
          gcloud run jobs deploy migrate --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat image.txt)" \
            --service-account "migrator@$PROJECT.iam.gserviceaccount.com" \
            --command node --args packages/db/src/migrate.ts \
            --set-env-vars "CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=migrator@$PROJECT.iam,DB_APP_USER=realtime@$PROJECT.iam,DB_CATALOG_USER=catalog-import@$PROJECT.iam,DB_SITE_USER=public-site@$PROJECT.iam" \
            --max-retries 0 --task-timeout 10m \
            --quiet
          gcloud run jobs execute migrate --project "$PROJECT" --region europe-southwest1 \
            --wait --quiet

      # The rooms live in PostgreSQL, so several instances share them. After a deploy the previous
      # revision keeps its sockets for up to an hour, so two revisions may run side by side: at most
      # 2 instances each, with a pool of 3 and the LISTEN connection, are 16 connections; with 1 of
      # the migrate job, 1 of the close-rooms job and 1 of the catalog-import job, 19, the 19 the
      # micro instance leaves to the app users (25, minus 3 for superusers and 3 Cloud SQL uses).
      # The generate-site job takes the one of catalog-import: a deploy and a load of the catalog never
      # run at the same time (the concurrency of this job), and its schedule runs it at night.
      # Each open socket is one of the 250 requests an instance takes at once: 500 sockets in all,
      # which the capacity alert in ops/monitoring counts on.
      # The CPU stays with the instance between requests: its beat, the check of LISTEN, the cleaning
      # of dead instances and the export of telemetry run on timers, with no request open.
      # Dev and prod are closed to the public: entering a room asks for the access code of the
      # environment, which Secret Manager keeps as access-code. Mounted as a file, every read of it
      # asks Secret Manager, so a new version of the secret takes over without deploying.
      - name: Deploy the room server
        run: |
          gcloud run deploy realtime --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat image.txt)" \
            --service-account "realtime@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT,CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=realtime@$PROJECT.iam,DB_POOL_SIZE=3,APP_CHECK=required,ACCESS_CODE_FILE=/secrets/access-code/value,WEB_ORIGINS=https://$WEB_DOMAIN https://$PROJECT.web.app https://$PROJECT.firebaseapp.com" \
            --set-secrets "/secrets/access-code/value=access-code:latest" \
            --timeout 3600 --session-affinity --min-instances 0 --max-instances 2 --concurrency 250 \
            --no-cpu-throttling \
            --quiet

      - name: Check the room server answers
        run: |
          url=$(gcloud run services describe realtime --project "$PROJECT" --region europe-southwest1 --format 'value(status.url)')
          curl --silent --show-error --fail --retry 5 --retry-all-errors "$url/health"

      # The service of the public web answers from the bucket behind Firebase Hosting, which sends it
      # /{language}/…, so it goes before the web, whose rewrites need it. Hosting calls it as anyone,
      # so anyone may invoke it; it runs as an account that may only read the bucket. The deploy
      # waits until its new revision is ready.
      - name: Deploy the service of the public web
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: |
          gcloud run deploy site --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat site-image.txt)" \
            --service-account "site-server@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars "ENVIRONMENT=$ENVIRONMENT,SITE_BUCKET=$PROJECT-site,SITE_ORIGIN=https://$WEB_DOMAIN,ADSENSE_CLIENT=$ADSENSE_CLIENT" \
            --min-instances 0 --max-instances 2 --concurrency 80 \
            --quiet

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps/web/dist
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      # Hosting answers a file before any rewrite: the app goes as app.html, so the root of the
      # domain reaches the service of the public web, and every address of the app gets app.html.
      - name: Put the config of the environment next to the web, and the app as app.html
        run: |
          cp "apps/web/config/${{ inputs.environment }}.json" apps/web/dist/config.json
          mv apps/web/dist/index.html apps/web/dist/app.html

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      # The token GitHub signed at the first sign-in lasts minutes, and migrating and deploying the
      # room server may take longer. gcloud keeps going on what it already traded the token for; the
      # Firebase CLI trades it again, so it needs a fresh one.
      - name: Sign in to Google Cloud again, for the Firebase CLI
        env:
          SERVICE_ACCOUNT: deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
        run: .github/scripts/gcp-auth.sh

      - name: Publish the web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec firebase deploy --only hosting --project "$PROJECT" --non-interactive

      # The job of the public web reads the public catalog with a user that only reads the tables of
      # Dilemmas and writes the pages into the bucket of the environment. It runs here, after the
      # web, so a failure leaves the room server and its web in step; and every night at 04:00,
      # after any load of the day. The schedule signs in as the scheduler account.
      - name: Deploy the job that generates the public web, run it and schedule it
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: |
          gcloud run jobs deploy generate-site --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat site-image.txt)" \
            --service-account "public-site@$PROJECT.iam.gserviceaccount.com" \
            --command node --args apps/site/src/jobs/generate-site.ts \
            --set-env-vars "CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=public-site@$PROJECT.iam,SITE_BUCKET=$PROJECT-site,SITE_ORIGIN=https://$WEB_DOMAIN,ADSENSE_CLIENT=$ADSENSE_CLIENT" \
            --max-retries 1 --task-timeout 30m \
            --quiet
          gcloud run jobs execute generate-site --project "$PROJECT" --region europe-southwest1 \
            --wait --quiet
          schedule=(
            --project "$PROJECT" --location europe-west1
            --schedule "0 4 * * *" --time-zone Etc/UTC
            --uri "https://run.googleapis.com/v2/projects/$PROJECT/locations/europe-southwest1/jobs/generate-site:run"
            --http-method POST
            --oauth-service-account-email "scheduler@$PROJECT.iam.gserviceaccount.com"
            --quiet
          )
          if gcloud scheduler jobs describe generate-site --project "$PROJECT" --location europe-west1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http generate-site "${schedule[@]}"
          else
            gcloud scheduler jobs create http generate-site "${schedule[@]}"
          fi

      # Every hour, Cloud Scheduler runs the job that deletes the closed rooms with their game data,
      # so no closed room lasts more than an hour and a quarter. Same image and service account as
      # the room server, which may already do it; a failed run is tried once more, and the next hour
      # tries again. The schedule signs in as the scheduler account, which may only run this job.
      # Last, after the web: if it fails, the room server and the web it serves are already in step.
      # Cloud Scheduler has no Madrid region: the schedule lives in Belgium, in the EU, and holds no
      # personal data, only when to run the job, which stays in Madrid next to the database.
      - name: Deploy the job that deletes the closed rooms, and its schedule
        run: |
          gcloud run jobs deploy close-rooms --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat image.txt)" \
            --service-account "realtime@$PROJECT.iam.gserviceaccount.com" \
            --command node --args apps/realtime/src/jobs/close-rooms.ts \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT,CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=realtime@$PROJECT.iam" \
            --max-retries 1 --task-timeout 10m \
            --quiet
          schedule=(
            --project "$PROJECT" --location europe-west1
            --schedule "0 * * * *" --time-zone Etc/UTC
            --uri "https://run.googleapis.com/v2/projects/$PROJECT/locations/europe-southwest1/jobs/close-rooms:run"
            --http-method POST
            --oauth-service-account-email "scheduler@$PROJECT.iam.gserviceaccount.com"
            --quiet
          )
          if gcloud scheduler jobs describe close-rooms --project "$PROJECT" --location europe-west1 >/dev/null 2>&1; then
            gcloud scheduler jobs update http close-rooms "${schedule[@]}"
          else
            gcloud scheduler jobs create http close-rooms "${schedule[@]}"
          fi

      # The job that loads the Catalog of dilemmas of Notion, with its translations, which the
      # workflow Import the catalog runs by hand: here it only gets the new image. Same image as the
      # room server, but an account of its own: only it reads the token of Notion and the key of
      # Anthropic in Secret Manager, and its database user only touches the tables of Dilemmas, so
      # the public room server can read neither. Loading again changes only what changed in Notion,
      # so a run that failed is just run again.
      - name: Deploy the job that loads the catalog
        run: |
          gcloud run jobs deploy catalog-import --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat image.txt)" \
            --service-account "catalog-import@$PROJECT.iam.gserviceaccount.com" \
            --command node --args apps/realtime/src/jobs/catalog-import.ts \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT,CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=catalog-import@$PROJECT.iam" \
            --set-secrets "NOTION_TOKEN=notion-token:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest" \
            --max-retries 0 --task-timeout 3h \
            --quiet
