name: Deploy to an environment

# The same steps for dev and for prod: only the environment changes, and with it the project,
# the deployer that may act there and, for prod, Mario's approval before the job starts. Both
# deploy what one run of Deploy built: its commit, its image and its web.
on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        required: true
        type: string
      commit:
        description: The commit that run of Deploy built
        required: true
        type: string
      run-id:
        description: The run of Deploy that built the image and the web
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      PROJECT: thelever-app-${{ inputs.environment }}
      WORKLOAD_IDENTITY_PROVIDER: projects/236232367578/locations/global/workloadIdentityPools/github/providers/thelever-app-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Sign in to Google Cloud as the deployer of the environment
        env:
          SERVICE_ACCOUNT: deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
        run: .github/scripts/gcp-auth.sh

      # The database of dev stops when unused: every deploy starts it, and it stops again each night.
      - name: Start the database of dev
        if: inputs.environment == 'dev'
        run: |
          gcloud sql instances patch thelever --project "$PROJECT" \
            --activation-policy ALWAYS --quiet

      # From the same image as the room server, before its new revision serves anyone: each
      # migration must also work with the revision still serving. A failure stops the deploy.
      - name: Migrate the database and load the seed
        run: |
          gcloud run jobs deploy migrate --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat image.txt)" \
            --service-account "migrator@$PROJECT.iam.gserviceaccount.com" \
            --command sh \
            --args=-c,"node packages/db/src/migrate.ts && node packages/db/seeds/load.ts" \
            --set-env-vars "CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=migrator@$PROJECT.iam,DB_APP_USER=realtime@$PROJECT.iam" \
            --max-retries 0 --task-timeout 10m \
            --quiet
          gcloud run jobs execute migrate --project "$PROJECT" --region europe-southwest1 \
            --wait --quiet

      # The rooms live in PostgreSQL, so several instances share them. At most 3, with a pool of 5
      # and the LISTEN connection each: 18 connections, within the 25 of the micro instance.
      - name: Deploy the room server
        run: |
          gcloud run deploy realtime --project "$PROJECT" --region europe-southwest1 \
            --image "$(cat image.txt)" \
            --service-account "realtime@$PROJECT.iam.gserviceaccount.com" \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT,CLOUD_SQL_INSTANCE=$PROJECT:europe-southwest1:thelever,DB_USER=realtime@$PROJECT.iam,DB_POOL_SIZE=5" \
            --timeout 3600 --session-affinity --min-instances 0 --max-instances 3 \
            --quiet

      - name: Check the room server answers
        run: |
          url=$(gcloud run services describe realtime --project "$PROJECT" --region europe-southwest1 --format 'value(status.url)')
          curl --silent --show-error --fail --retry 5 --retry-all-errors "$url/health"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps/web/dist
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Put the config of the environment next to the web
        run: cp "apps/web/config/${{ inputs.environment }}.json" apps/web/dist/config.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Publish the web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec firebase deploy --only hosting --project "$PROJECT" --non-interactive
