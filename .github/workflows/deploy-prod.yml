name: Deploy to prod

# Promotes to prod what a run of Deploy built and deployed to dev, once Mario approves the prod
# environment. Apart from Deploy, so a commit waiting for that approval never holds back dev.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One commit waits for approval at a time; a newer one waits behind it and replaces any commit
# that was already waiting there, so after deciding on the first, the latest is the one offered.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prod:
    # Only a run of this repository's own Deploy, on a push to main: workflow_run matches a run by
    # the name of its workflow and the name of its branch, which a pull request from a fork with a
    # branch called main and a workflow called Deploy also has.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/deploy.yml'
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      actions: read
      contents: read
      id-token: write
    with:
      environment: prod
      commit: ${{ github.event.workflow_run.head_sha }}
      run-id: ${{ github.event.workflow_run.id }}
    # A reusable workflow gets no secret its caller does not pass on, not even those of the
    # environment its job runs in: the legal notice needs those of the environment.
    secrets: inherit
