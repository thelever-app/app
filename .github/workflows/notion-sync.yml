name: Notion sync

on:
  create:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

# Two events for the same branch never update Notion at the same time.
concurrency:
  group: notion-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    # New branches, and PRs from this repo only: forks get no secrets.
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Once a PR is closed its branch may be gone: run the script from main.
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || '' }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Update the task in Notion
        run: node .github/scripts/notion-sync.ts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DATA_SOURCE_ID: ${{ vars.NOTION_TASKS_DATA_SOURCE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'create' && github.event.ref || github.head_ref }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_URL: ${{ github.event.pull_request.html_url }}
