name: CI

# On main the checks run inside the deployment, which calls this workflow before building anything:
# the same checks guard a pull request and a deployment.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A new push to the same PR, or to main, cancels the checks that are still going.
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @thelever-app/web build

      - name: Test acceptance
        run: pnpm test:acceptance

  # The scenarios tagged @ui in Chromium, against the room server, the built web and the Auth
  # emulator, all of them on the runner. The Auth emulator runs on Node: no Java needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @thelever-app/tests exec playwright install --with-deps chromium

      - name: Test e2e
        run: pnpm test:e2e
